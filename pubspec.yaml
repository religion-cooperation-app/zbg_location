name: zbg_location
description: Reusable geolocation engine for FlutterFlow (FBG adapter).
version: 0.1.1
publish_to: "none"
homepage:

environment:
  sdk: ">=3.0.0 <4.0.0"
  # Keep this broad so it works with your installed Flutter (3.x).
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Transistorsoft Background Geolocation (works in DEBUG without a license)
  flutter_background_geolocation: ^5.0.1
  # Handy collection helpers (optional, but useful)
  collection: ^1.18.0
  # Production crash reporting — must be enabled in host app (FlutterFlow Crashlytics toggle)
  firebase_crashlytics: ^4.0.0
  cloud_firestore: ^5.6.9
  firebase_auth: ^5.6.0
  sqflite: ^2.3.3
  path: ^1.9.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  # (No assets/fonts needed for this package)
